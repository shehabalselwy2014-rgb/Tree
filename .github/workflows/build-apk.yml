name: Build Juthoor APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: |
          tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore

      - name: Configure optional Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK copy
        run: cp app/build/outputs/apk/debug/app-debug.apk Juthoor_v0.8.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Juthoor-APK-v0.8.0
          path: Juthoor_v0.8.0.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create latest-apk Juthoor_v0.8.0.apk \
            --title "جِذور - أحدث نسخة APK (v0.8.0)" \
            --notes "تم بناء ملف التثبيت تلقائياً عبر GitHub Actions." \
            --prerelease
