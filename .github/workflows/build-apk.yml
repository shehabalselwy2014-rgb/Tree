name: Build & Test Juthoor Preview APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test & Build Debug Preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK_ROOT"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure optional Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          fi

      - name: Run unit tests and build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Read app version name and prepare named APK
        id: version
        run: |
          APP_VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APP_VER="${APP_VER:-0.8.0}"
          echo "app_version=$APP_VER" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "Juthoor_v${APP_VER}_debug_preview.apk"

      - name: Upload Preview APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Juthoor-Preview-APK-v${{ steps.version.outputs.app_version }}
          path: Juthoor_v${{ steps.version.outputs.app_version }}_debug_preview.apk
          if-no-files-found: error

      - name: Publish Debug Preview Pre-Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VER="${{ steps.version.outputs.app_version }}"
          APK_FILE="Juthoor_v${APP_VER}_debug_preview.apk"
          gh release delete preview-apk --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create preview-apk "$APK_FILE" \
            --title "جِذور - نسخة معاينة تجريبية (Debug Preview v${APP_VER})" \
            --notes "نسخة معاينة تجريبية (Debug APK) مبنية آلياً بعد اجتياز اختبارات الوحدة — ليست نسخة إصدار نهائي للمتجر." \
            --prerelease
